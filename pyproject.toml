[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "oryza-elo"
version = "0.1.0"
description = "Oryza-Elo: Edge Machine Learning and Microclimate Phenology Classification for Rice Crops"
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2.0",
  "numpy>=1.26.0",
  "requests>=2.31.0",
  "openpyxl>=3.1.2",
  "scikit-learn>=1.4.0",
  "catboost>=1.2.0",
  "xgboost>=2.0.0",
  "pydantic>=2.7.0",
  "pydantic-settings>=2.2.0",
  "rich>=13.7.0",
  "typer>=0.12.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.0.0",
  "pytest-cov>=4.1.0",
]

[project.scripts]
oryza = "lib.entrypoints:cli_entrypoint"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q"

[tool.setuptools]
include-package-data = true

[tool.setuptools.packages.find]
where = ["."]
include = ["lib*"]
